# Dependabot version updates. Grouped, so one ecosystem opens one pull request a week.
version: 2
updates:
  # A pinned action rots, and an unmaintained action is a supply chain problem.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies]
