name: Dev build

# Every merge to dev publishes a :dev image. No version is cut and no tag is created —
# dev is an integration branch, and versions belong to main.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Build and push :dev
    needs: checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects an uppercase path, and the owner here is mixed-case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Dev image published"
            echo
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:dev"
            echo '```'
            echo
            echo "Also tagged \`dev-${GITHUB_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"
