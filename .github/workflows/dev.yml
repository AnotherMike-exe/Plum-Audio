name: Dev build

# Every merge to dev publishes a :dev image. No version is cut and no tag is created —
# dev is an integration branch, and versions belong to main.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Build and push :dev
    needs: checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` needs the tags; a shallow clone reports "unknown"

      # ghcr.io rejects an uppercase path, and the owner here is mixed-case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # docker/build.sh does this for a workstation build. CI has to do it too, or the Dockerfile
      # ARG defaults win and every published image reports 0.0.0-dev / unknown on its About page —
      # which is exactly what :dev did until 2026-09-08. Dev is never a release: the version is the
      # last cut tag with a -dev suffix, so :dev built after v1.0.0 reports 1.0.0-dev.
      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          last_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          [[ -n "$last_tag" ]] || last_tag="v0.0.0"
          echo "version=${last_tag#v}-dev"                                  >> "$GITHUB_OUTPUT"
          echo "describe=$(git describe --tags --always 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            PLUM_APP_VERSION=${{ steps.version.outputs.version }}
            PLUM_BUILD_TYPE=dev
            PLUM_GIT_DESCRIBE=${{ steps.version.outputs.describe }}
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Dev image published"
            echo
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:dev"
            echo '```'
            echo
            echo "Also tagged \`dev-${GITHUB_SHA:0:7}\`. Reports app version \`${{ steps.version.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
