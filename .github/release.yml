# Groups the auto-generated release notes by label.
# Every label below must exist on the repository, or its pull requests fall into
# the catch-all group at the bottom.
changelog:
  exclude:
    labels: [internal, no-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Documentation
      labels: [docs]
    - title: Dependencies
      labels: [dependencies]
    - title: Other
      labels: ["*"]
