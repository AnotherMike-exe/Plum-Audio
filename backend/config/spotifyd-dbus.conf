<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Plum-Audio — system D-Bus policy for Spotify (spotifyd) MPRIS.

  spotifyd (built with the mpris feature) owns a per-instance well-known name on the SYSTEM bus and
  serves the standard org.mpris.MediaPlayer2[.Player] interfaces at /org/mpris/MediaPlayer2 under it.
  The name DIFFERS BY VERSION: spotifyd 0.4.x uses "rs.spotifyd.instance[PID]"; older builds used
  "org.mpris.MediaPlayer2.spotifyd[.instancePID]". We allow owning + sending to BOTH so any version
  works. Without this, spotifyd logs "not allowed to own the service ..." and, because it registers
  MPRIS right after authenticating a session, CRASHES on first play.

  NOTE: XML comments must not contain a double-hyphen, so avoid writing flag names with them here.

  Install: copy to /etc/dbus-1/system.d/ and restart dbus (or reboot). Requires a running system
  dbus-daemon (/run/dbus/system_bus_socket).

  IMPORTANT: user="..." MUST match the user spotifyd AND the Sendspin server run as. On the Pi test
  rigs that is plum-admin; in the container it is whatever supervisord launches them as (PUID/PGID).
  Change the user= blocks if that differs, or D-Bus denies name ownership / sends.
-->
<busconfig>
  <policy user="plum-admin">
    <allow own_prefix="rs.spotifyd"/>
    <allow send_destination="rs.spotifyd.instance*"/>
    <allow own_prefix="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd.instance*"/>
    <allow send_interface="org.mpris.MediaPlayer2"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root">
    <allow own_prefix="rs.spotifyd"/>
    <allow own_prefix="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="rs.spotifyd.instance*"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd.instance*"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy context="default">
    <allow receive_sender="rs.spotifyd.instance*"/>
    <allow receive_sender="org.mpris.MediaPlayer2.spotifyd"/>
  </policy>
</busconfig>
