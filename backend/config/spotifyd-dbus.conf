<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Plum-Audio — system D-Bus policy for Spotify (spotifyd) MPRIS.

  spotifyd (built --with-mpris) owns org.mpris.MediaPlayer2.spotifyd on the SYSTEM bus. With
  multiple instances, the first claims that base name and later instances get PID-suffixed names
  (org.mpris.MediaPlayer2.spotifyd.instance<PID>) — so we must allow owning the prefix, and our
  server must be allowed to send to any of those names to read metadata and drive transport.

  Install: copy to /etc/dbus-1/system.d/ and restart dbus (or reboot). Requires a running system
  dbus-daemon (/run/dbus/system_bus_socket).

  IMPORTANT: user="..." MUST match the user spotifyd AND the Sendspin server run as. On the Pi test
  rigs that is plum-admin; in the container it is whatever supervisord launches them as (PUID/PGID).
  Change the user= blocks if that differs, or D-Bus denies name ownership / sends.
-->
<busconfig>
  <policy user="plum-admin">
    <allow own="org.mpris.MediaPlayer2.spotifyd"/>
    <allow own_prefix="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd.instance*"/>
    <allow send_interface="org.mpris.MediaPlayer2"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root">
    <allow own_prefix="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination="org.mpris.MediaPlayer2.spotifyd.instance*"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy context="default">
    <allow receive_sender="org.mpris.MediaPlayer2.spotifyd"/>
  </policy>
</busconfig>
