<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Plum-Audio — system D-Bus policy for the Bluetooth A2DP sink (bluealsa).

  bluez-alsa's daemon owns org.bluealsa on the SYSTEM bus (it has to: it registers a
  MediaEndpoint1 with bluetoothd there, and the ALSA `bluealsa` PCM plugin resolves the daemon by
  that name). The policy Debian ships (/usr/share/dbus-1/system.d/bluealsa.conf) grants
  own_prefix="org.bluealsa" to user="root" ONLY — group "audio" may send to it but not own it.

  sources/bluetooth_manager.py spawns the daemon as OUR user, not root, so without this file it
  dies at startup with:

      E: main.c:137: Couldn't acquire D-Bus name. Please check D-Bus configuration.
                     Requested name: org.bluealsa

  (Verified on the rig, 2026-07-28, bluez-alsa 4.3.1 / plum-admin.)

  Scoped to group="audio" rather than a username on purpose: that one group covers plum-admin on
  the Pi rigs AND the container's PUID user, which already has to be in `audio` to open /dev/snd.
  The root block keeps the container working when it runs the daemon as root instead.

  Install: copy to /etc/dbus-1/system.d/ and restart dbus (or reboot). Requires a running system
  dbus-daemon (/run/dbus/system_bus_socket).
-->
<busconfig>
  <policy group="audio">
    <allow own="org.bluealsa"/>
    <allow own_prefix="org.bluealsa"/>
    <allow send_destination="org.bluealsa"/>
  </policy>
  <policy user="root">
    <allow own="org.bluealsa"/>
    <allow own_prefix="org.bluealsa"/>
    <allow send_destination="org.bluealsa"/>
  </policy>
</busconfig>
