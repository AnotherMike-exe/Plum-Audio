//
// Plum-Audio — shairport-sync (AirPlay) → raw PCM FIFO for the Sendspin ingest feeder.
//
// The pipe backend decodes AirPlay to interleaved S16LE 44100:2 and writes it to the FIFO that
// backend/scripts/sendspin_server.py's SourceFeeder reads (PLUM_AIRPLAY_FIFO, default
// /tmp/airplay-fifo). That format matches DEFAULT_FORMAT there — no resample on the AirPlay path.
//
// Metadata/artwork are emitted out-of-band to a *separate* metadata pipe, consumed by the AirPlay
// control script (Phase 1 item 3) which forwards them to Sendspin metadata/artwork roles — NOT
// onto the audio stream. That is why the five Snapcast resync guards are gone: a metadata push is
// no longer an audio-stream event.
//
// Multi-instance AirPlay (per-source ports 5050-5059) is layered on later by the endpoint API,
// which stamps `port` + `name` + pipe paths per instance. This file is the single-instance base.
//

general = {
    name = "Plum Audio";                 // AirPlay receiver name (override per unit via templating)
    output_backend = "pipe";
    mdns_backend = "avahi";              // advertise via the host's Avahi (see docker-compose mounts)
    port = 5000;                         // RAOP control port; audio ports negotiated
    drift_tolerance_in_seconds = 0.002;
    resync_threshold_in_seconds = 0.050; // resync if playback drifts past this
    volume_range_db = 60;
    ignore_volume_control = "no";        // apply the iPhone volume to the PCM (source master vol);
                                         //   Sendspin then applies per-player (per-room) volume.
    volume_control_profile = "standard";
};

// Pipe audio backend — where the decoded PCM goes.
pipe = {
    name = "/tmp/airplay-fifo";          // == PLUM_AIRPLAY_FIFO; the feeder creates + reads it
    audio_backend_buffer_desired_length_in_seconds = 0.2;
    audio_backend_latency_offset_in_seconds = 0.0;
};

sessioncontrol = {
    session_timeout = 20;                // drop the FIFO writer (feeder sees EOF → idle) after 20s idle
    allow_session_interruption = "yes";  // let a new sender take over
};

// Out-of-band metadata + cover art → separate pipe for the control script (Phase 1 item 3).
// Harmless before that reader exists: shairport drops metadata after pipe_timeout, audio is
// unaffected. Set enabled = "no" if you want to defer wiring it entirely.
metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    cover_art_cache_directory = "/tmp/airplay-covers";
    pipe_name = "/tmp/airplay-metadata-fifo";
    pipe_timeout = 5000;
};

diagnostics = {
    log_verbosity = 0;                   // 0=quiet; raise to 1-3 on hardware to debug sessions
};
