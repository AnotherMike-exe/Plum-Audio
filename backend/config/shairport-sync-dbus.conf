<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Plum-Audio — system D-Bus policy for AirPlay transport control (Step 2).

  shairport-sync (built --with-mpris-interface) owns org.mpris.MediaPlayer2.ShairportSync on the
  SYSTEM bus and relays MPRIS Player calls back to the AirPlay sender as DACP. Without this policy
  it logs "could not acquire ... MPRIS interface" and transport control is dead.

  Install: copy to /etc/dbus-1/system.d/ and restart dbus (or reboot). Requires a running system
  dbus-daemon (/run/dbus/system_bus_socket).

  IMPORTANT: the user="..." below MUST match the user shairport-sync runs as. On the Pi test rigs
  that is plum-admin; in the container it is whatever supervisord launches shairport as (set via
  PUID/PGID). Change both policy blocks' user= if that differs, or D-Bus will deny name ownership.
-->
<busconfig>
  <policy user="plum-admin">
    <allow own="org.gnome.ShairportSync"/>
    <allow own_prefix="org.gnome.ShairportSync"/>
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow send_destination="org.gnome.ShairportSync.i*"/>
    <allow own="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination="org.mpris.MediaPlayer2.ShairportSync.i*"/>
    <allow send_interface="org.mpris.MediaPlayer2"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy user="root">
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination="org.mpris.MediaPlayer2.ShairportSync.i*"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
