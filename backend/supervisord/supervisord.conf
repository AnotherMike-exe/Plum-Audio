; Plum-Audio — supervisord entrypoint. Manages the per-unit process tree.
; Debug: docker exec plum-audio supervisorctl -c /app/supervisord/supervisord.conf tail -f <svc>

[supervisord]
nodaemon=true
user=root
logfile=/config/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /app/supervisord/conf.d/*.ini
