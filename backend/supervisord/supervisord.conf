; Plum-Audio — supervisord entrypoint. Manages the per-unit process tree.
; Debug: docker exec plum-audio supervisorctl -c /app/supervisord/supervisord.conf tail -f <svc>

[supervisord]
nodaemon=true
user=root
logfile=/config/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
; The RUNTIME program set, composed by entrypoint.sh from the templates in /app/supervisord/conf.d.
; A unit with no audio output must not merely have its player stopped — the program must not exist.
; supervisord does not expand %(ENV_x)s in `autostart`, and `autostart=false` still reports STOPPED
; in `supervisorctl status`, which deploy.sh reads as a failed deploy. Omitting the file is the only
; way to say "this unit has three programs, and that is correct".
files = /run/plum-supervisor.d/*.ini
