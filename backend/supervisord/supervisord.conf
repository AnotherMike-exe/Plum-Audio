; Plum-Audio — supervisord entrypoint. Manages the per-unit process tree.
; Debug: docker exec plum-audio supervisorctl -c /app/supervisord/supervisord.conf tail -f <svc>

[supervisord]
nodaemon=true
user=root
logfile=/config/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; RESTART POLICY — the same on all four programs, set in each conf.d/*.ini.
;
; supervisord has two different retry paths, and only one of them was covered before:
;   - A program that was RUNNING and exits is restarted by `autorestart=true`, at once, forever.
;   - A program that exits BEFORE `startsecs` never reached RUNNING. That is a failed START, and
;     those are counted against `startretries`. The default is 3. After the fourth failure the
;     program is FATAL and supervisord never tries again — while PID 1 stays up, so the container
;     looks alive and nothing restarts it. A DAC that registers late (an I2S HAT probes
;     asynchronously) or a port still held by the previous container produced exactly that, and
;     the only way out was a power cycle.
;
; startretries=600. The delay supervisord applies is LINEAR, not exponential: it waits 1 s after
; the first failed start, 2 s after the second, and n seconds after the nth (supervisor 4.2.5,
; process.py: `self.backoff += 1; self.delay = now + self.backoff`), and it gives up when the
; count passes startretries. The count returns to 0 when the program reaches RUNNING. So 600 means
; the longest wait between two tries is 10 minutes and FATAL comes after about 50 hours of
; continuous failure. A larger number would not be safer: the delay has no cap, so 5000 retries
; ends in 83-minute gaps, and a unit whose DAC came back would stay silent that long. FATAL after
; 50 hours is reported by the container healthcheck (scripts/healthcheck.py -> /data/health.json).
;
; startsecs is how long a program must stay up to count as started. It must be LONGER than the
; slowest start-up failure, or that failure is counted as a clean run: the program is restarted
; with no delay and no count, every few seconds, without limit. The two audio programs can take
; several seconds to fail (PortAudio initialisation and `aplay -l` before the DAC open raises, a
; bind that waits), so they get 10. nginx and the config API fail fast and get 5.
;
; Cost: `supervisorctl status` reports STARTING for that long after every start, and deploy.sh
; waits for RUNNING — it allows 90 s.

[include]
; The RUNTIME program set, composed by entrypoint.sh from the templates in /app/supervisord/conf.d.
; A unit with no audio output must not merely have its player stopped — the program must not exist.
; supervisord does not expand %(ENV_x)s in `autostart`, and `autostart=false` still reports STOPPED
; in `supervisorctl status`, which deploy.sh reads as a failed deploy. Omitting the file is the only
; way to say "this unit has three programs, and that is correct".
files = /run/plum-supervisor.d/*.ini
