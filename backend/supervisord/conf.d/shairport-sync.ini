; AirPlay receiver → PCM FIFO. Writes /tmp/airplay-fifo (read by the sendspin_server feeder).
; Advertises via the host Avahi/D-Bus (docker-compose mounts the host sockets). Starts after the
; server so the FIFO reader is already present; if not, shairport waits on the pipe writer open.
[program:shairport-sync]
command=shairport-sync -c /app/config/shairport-sync.conf
priority=30
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/config/logs/shairport-sync.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
