; Flask host for the config REST APIs (settings; integrations/audio later) on port 5002.
; Separate process from the mesh API (aiohttp, 5001) — see apis/server.py.
[program:config_api]
command=python3 /app/scripts/apis/server.py
priority=15
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
environment=PLUM_SETTINGS_FILE="/data/settings.json"
stdout_logfile=/config/logs/config_api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
