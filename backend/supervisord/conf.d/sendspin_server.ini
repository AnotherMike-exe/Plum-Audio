; In-process Sendspin server + AirPlay FIFO feeder + local-player auto-attach glue.
; Starts first so the FIFO exists and the source group is up before shairport-sync writes.
[program:sendspin_server]
command=python3 /app/scripts/sendspin_server.py
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/config/logs/sendspin_server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
