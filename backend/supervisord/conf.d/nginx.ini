; Per-unit web GUI: serves the built React app from /app/www and proxies the local APIs
; (mesh :5001, config :5002). See config in /app/nginx/plum-audio.conf, installed by the Dockerfile
; into /etc/nginx/conf.d/. Low priority — it only needs the APIs to be up by the time a browser
; actually calls them, and it retries nothing itself.
[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/config/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
