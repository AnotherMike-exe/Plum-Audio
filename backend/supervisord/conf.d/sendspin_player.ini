; The unit's hardware render endpoint (Sendspin PLAYER → ALSA/onboard DAC).
; Listens on 8928; the local sendspin_server dials + attaches it (order-independent, self-heals).
; Needs /dev/snd (docker-compose devices) and membership of the audio group (PGID).
[program:sendspin_player]
command=python3 /app/scripts/sendspin_player.py
priority=20
autostart=true
autorestart=true
; Restart policy: see supervisord.conf. 10 s because a DAC that will not open takes a few seconds to
; say so, and a failure counted as a clean run restarts with no delay, without limit.
startsecs=10
startretries=600
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/config/logs/sendspin_player.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
