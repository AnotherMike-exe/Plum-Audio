# Plum-Audio backend — tooling config (black + ruff). Python 3.13, 120 cols (see CLAUDE.md).
[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Pragmatic set: pyflakes/pycodestyle/isort/bugbear/comprehensions/pyupgrade + a few extras.
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "ANN", "BLE"]
# Docstrings/self/cls annotations aren't worth the noise on internal helpers; keep BLE for the
# deliberate "must-not-die" broad excepts that are already justified with inline noqa.
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Feeders/listeners intentionally swallow broad exceptions to stay alive; annotated inline.
"scripts/sendspin_server.py" = ["BLE001"]
"scripts/sendspin_player.py" = ["BLE001"]
