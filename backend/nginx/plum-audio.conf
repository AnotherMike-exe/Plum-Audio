# Plum-Audio — per-unit web GUI.
#
# Every unit serves its own control page: nginx hands out the built React app and proxies the two
# local API surfaces, so the GUI is same-origin and needs no CORS, no dev proxy, and no build-time
# host baked in. Ported from Plum-Snapcast's frontend container, with two changes: it runs INSIDE
# the unit container under supervisord (Plum-Audio is one container per unit, not app+frontend),
# and it fronts the split API pair rather than a single Flask host.
#
#   /api/mesh/*      -> 127.0.0.1:5001  aiohttp, in the audio event loop (topology, route, volume)
#   /api/settings    -> 127.0.0.1:5002  Flask config host
#   /api/integrations,/api/audio,/api/playback -> 127.0.0.1:5002
#   everything else  -> the SPA (client-side routing via try_files)
#
# NOT proxied: the Sendspin controller WebSocket. The GUI opens one per SOURCE directly at
# ws://<unit-host>:8927/sendspin — including to peer units, which nginx here could never front —
# so proxying our own would buy nothing and hide the port asymmetry. Same for peer mesh APIs: the
# data service talks to http://<peer-host>:5001 directly (their CORS is open).

# WS upgrade helper for the /api/mesh/consume relay (valid here — conf.d is in the http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/www;
    index index.html;

    # Built assets are content-hashed by Vite; index.html must never be cached or a redeploy
    # keeps serving the old asset graph.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/mesh/ {
        proxy_pass http://127.0.0.1:5001/api/mesh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS upgrade for /api/mesh/consume (the foreign-server consume relay). Harmless for the
        # plain-HTTP endpoints on this location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /api/settings {
        proxy_pass http://127.0.0.1:5002/api/settings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/integrations/ {
        proxy_pass http://127.0.0.1:5002/api/integrations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/audio/ {
        proxy_pass http://127.0.0.1:5002/api/audio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact match first so it doesn't swallow /api/playback/<stream-id> (as in Plum-Snapcast).
    location = /api/playback {
        proxy_pass http://127.0.0.1:5002/api/playback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/playback/.+ {
        proxy_pass http://127.0.0.1:5002$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
