# Plum-Audio — per-unit web GUI.
#
# Every unit serves its own control page: nginx hands out the built React app and proxies the two
# local API surfaces, so the GUI is same-origin and needs no CORS, no dev proxy, and no build-time
# host baked in. Ported from Plum-Snapcast's frontend container, with two changes: it runs INSIDE
# the unit container under supervisord (Plum-Audio is one container per unit, not app+frontend),
# and it fronts the split API pair rather than a single Flask host.
#
#   /api/mesh/*      -> 127.0.0.1:5001  aiohttp, in the audio event loop (topology, route, volume)
#   /api/settings    -> 127.0.0.1:5002  Flask config host
#   /api/integrations,/api/audio -> 127.0.0.1:5002
#   everything else  -> the SPA (client-side routing via try_files)
#
# NOT proxied: the Sendspin controller WebSocket. The GUI opens one per SOURCE directly at
# ws://<unit-host>:8927/sendspin — including to peer units, which nginx here could never front —
# so proxying our own would buy nothing and hide the port asymmetry. Same for peer mesh APIs: the
# data service talks to http://<peer-host>:5001 directly (cors_policy allows a page served by a
# unit in the mesh view).

# WS upgrade helper for the /api/mesh/consume relay (valid here — conf.d is in the http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/www;
    index index.html;

    # Browser hardening, on every reply including the proxied APIs and error pages (`always`).
    #
    #   nosniff      a JSON or text reply is never run as a script because of its content.
    #   same-origin  a link out of the GUI does not send this unit's address to another site.
    #   SAMEORIGIN   another site cannot put this GUI in a frame and trick a click on it. The GUI
    #                has no login, so a framed page acts with full control of the unit.
    #
    # X-Frame-Options, not CSP frame-ancestors, and no doc in docs/ describes a framed use. If
    # Home Assistant must show this GUI in a panel (an iframe from ANOTHER origin), remove the
    # X-Frame-Options line in all three places: SAMEORIGIN refuses that.
    #
    # NGINX RULE: a location with its own add_header inherits NONE of these. The two locations
    # below that set Cache-Control therefore repeat all three. tests/Unit/test_nginx_conf.py checks it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Built assets are content-hashed by Vite; index.html must never be cached or a redeploy
    # keeps serving the old asset graph.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /api/mesh/ {
        proxy_pass http://127.0.0.1:5001/api/mesh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS upgrade for /api/mesh/consume (the foreign-server consume relay). Harmless for the
        # plain-HTTP endpoints on this location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /api/settings {
        proxy_pass http://127.0.0.1:5002/api/settings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/integrations/ {
        proxy_pass http://127.0.0.1:5002/api/integrations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/audio/ {
        proxy_pass http://127.0.0.1:5002/api/audio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Missing until 2026-09-08, and the failure was silent in the worst way: an unproxied /api/ path
    # falls through to the SPA `location /` below, which answers 200 with index.html. `response.ok`
    # is therefore true, `response.json()` throws on the HTML, and both the About panel and the
    # footer render their "no version yet" state forever. Any new API prefix needs a block here.
    location /api/about/ {
        proxy_pass http://127.0.0.1:5002/api/about/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
